<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Overlay - Option A: Hide/Reveal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #fff;
            overflow-x: hidden;
        }

        /* ASCII Background Layer */
        .ascii-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            white-space: pre;
            font-size: 14px;
            line-height: 14px;
            letter-spacing: 2px;
            color: #000;
            overflow: hidden;
        }

        /* Scrollable Grid Layer */
        .grid-container {
            position: relative;
            z-index: 10;
            padding: 100px 20px;
            min-height: 200vh;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Project Card */
        .project-card {
            background: #f5f5f5;
            border: 2px solid #000;
            padding: 0;
            transition: transform 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

        .project-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #fff;
            border-bottom: 2px solid #000;
        }

        .project-content {
            padding: 20px;
        }

        .project-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .project-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background: #000;
            color: #fff;
            padding: 4px 12px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Info overlay */
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 15px 20px;
            font-size: 12px;
            z-index: 100;
            max-width: 300px;
            line-height: 1.5;
            border: 2px solid #fff;
        }

        .info h3 {
            margin-bottom: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Info -->
    <div class="info">
        <h3>OPTION A: Hide/Reveal</h3>
        ASCII characters hide when grid elements overlap them, then reappear when elements scroll away. Scroll to see the effect.
    </div>

    <!-- ASCII Background -->
    <div class="ascii-background" id="asciiArt"></div>

    <!-- Scrollable Grid -->
    <div class="grid-container">
        <div class="projects-grid" id="projectsGrid"></div>
    </div>

    <script>
        // ASCII Configuration
        const CHARACTER_SET = ['.', '○', '∴', '⁘', '∗', '◎', '●', '◉'];
        const CHAR_WIDTH = 16;  // Approximate width including letter-spacing
        const CHAR_HEIGHT = 14;

        // Grid dimensions
        let gridWidth = 0;
        let gridHeight = 0;
        let asciiData = [];

        // Generate ASCII grid
        function generateAsciiGrid() {
            const asciiContainer = document.getElementById('asciiArt');
            gridWidth = Math.floor(window.innerWidth / CHAR_WIDTH);
            gridHeight = Math.floor(window.innerHeight / CHAR_HEIGHT);

            asciiData = [];
            for (let y = 0; y < gridHeight; y++) {
                for (let x = 0; x < gridWidth; x++) {
                    const char = CHARACTER_SET[Math.floor(Math.random() * CHARACTER_SET.length)];
                    asciiData.push({
                        x,
                        y,
                        char,
                        index: y * gridWidth + x
                    });
                }
            }

            console.log(`Generated ${asciiData.length} ASCII characters (${gridWidth}×${gridHeight})`);
        }

        // Calculate collision mask - which ASCII positions are hidden by grid elements
        function calculateCollisionMask() {
            const hiddenPositions = new Set();
            const projectCards = document.querySelectorAll('.project-card');

            projectCards.forEach(card => {
                const rect = card.getBoundingClientRect();

                // Convert pixel bounds to ASCII grid coordinates
                const startX = Math.max(0, Math.floor(rect.left / CHAR_WIDTH));
                const endX = Math.min(gridWidth, Math.ceil(rect.right / CHAR_WIDTH));
                const startY = Math.max(0, Math.floor(rect.top / CHAR_HEIGHT));
                const endY = Math.min(gridHeight, Math.ceil(rect.bottom / CHAR_HEIGHT));

                // Mark all positions within bounds as hidden
                for (let y = startY; y < endY; y++) {
                    for (let x = startX; x < endX; x++) {
                        const index = y * gridWidth + x;
                        hiddenPositions.add(index);
                    }
                }
            });

            return hiddenPositions;
        }

        // Render ASCII with collision mask
        function renderAscii() {
            const hiddenPositions = calculateCollisionMask();
            let result = '';

            for (let y = 0; y < gridHeight; y++) {
                for (let x = 0; x < gridWidth; x++) {
                    const index = y * gridWidth + x;
                    if (hiddenPositions.has(index)) {
                        result += ' ';
                    } else {
                        const char = asciiData.find(d => d.index === index);
                        result += char ? char.char : ' ';
                    }
                }
                result += '\n';
            }

            document.getElementById('asciiArt').textContent = result;
        }

        // Throttled scroll handler
        let rafId = null;
        function onScroll() {
            if (rafId) return;
            rafId = requestAnimationFrame(() => {
                renderAscii();
                rafId = null;
            });
        }

        // Generate dummy project data
        const projects = [
            { icon: '🌱', title: 'Life on Mars', tags: ['Biology', 'Space', 'Research'] },
            { icon: '🍄', title: 'Edible Futures', tags: ['Food', 'Design'] },
            { icon: '☕', title: 'Algae Sips', tags: ['Sustainability', 'Product'] },
            { icon: '🏛️', title: 'Closed Worlds', tags: ['Exhibition', 'Art', 'Science'] },
            { icon: '🏠', title: 'Climate House', tags: ['Architecture', 'Climate'] },
            { icon: '🔬', title: 'Bio Lab', tags: ['Research', 'Education'] },
            { icon: '🌊', title: 'Ocean Data', tags: ['Visualization', 'Marine'] },
            { icon: '🌿', title: 'Urban Garden', tags: ['Community', 'Green Space'] },
            { icon: '♻️', title: 'Waste to Energy', tags: ['Engineering', 'Sustainability'] },
            { icon: '🎨', title: 'Generative Art', tags: ['Creative Coding', 'Art'] },
            { icon: '🧬', title: 'DNA Archive', tags: ['Biotech', 'Data'] },
            { icon: '🌍', title: 'Earth Monitor', tags: ['Satellite', 'Climate'] }
        ];

        // Populate grid
        function populateGrid() {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = projects.map(project => `
                <div class="project-card">
                    <div class="project-image">${project.icon}</div>
                    <div class="project-content">
                        <div class="project-title">${project.title}</div>
                        <div class="project-tags">
                            ${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Initialize
        window.addEventListener('load', () => {
            generateAsciiGrid();
            populateGrid();
            renderAscii();

            // Update on scroll
            window.addEventListener('scroll', onScroll, { passive: true });

            // Update on resize
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    generateAsciiGrid();
                    renderAscii();
                }, 300);
            });
        });
    </script>
</body>
</html>
